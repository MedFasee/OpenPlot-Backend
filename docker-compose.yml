services:
  postgres:
    image: ${OPENPLOT_POSTGRES_IMAGE:-timescale/timescaledb:latest-pg17}
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      POSTGRES_DB: ${OPENPLOT_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${OPENPLOT_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${OPENPLOT_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${OPENPLOT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/dumps/openplot_create_timescaledb.sql:/docker-entrypoint-initdb.d/01-openplot-create-timescaledb.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT 1 FROM pg_extension WHERE extname = 'timescaledb'"
          | grep -q 1 &&
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT 1 FROM information_schema.tables WHERE table_schema = 'openplot' AND table_name = 'measurements_ht'"
          | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - openplot-network

  openplot-api:
    image: ${OPENPLOT_API_IMAGE:-openplot-api:${OPENPLOT_VERSION:-dev}}
    environment:
      ASPNETCORE_ENVIRONMENT: ${OPENPLOT_API_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:7011
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=${OPENPLOT_POSTGRES_DB:-postgres};Username=${OPENPLOT_POSTGRES_USER:-postgres};Password=${OPENPLOT_POSTGRES_PASSWORD:-postgres}
      XmlFolder: /data/xml
    ports:
      - "${OPENPLOT_API_PORT:-7011}:7011"
    volumes:
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/xml:/data/xml
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/exports:/data/exports
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/logs/api:/app/logs
      - ./OpenPlot.Api/Auth:/app/auth:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openplot-network

  openplot-export-worker:
    image: ${OPENPLOT_EXPORT_WORKER_IMAGE:-openplot-export-worker:${OPENPLOT_VERSION:-dev}}
    environment:
      ConnectionStrings__OpenPlotDb: Host=postgres;Port=5432;Database=${OPENPLOT_POSTGRES_DB:-postgres};Username=${OPENPLOT_POSTGRES_USER:-postgres};Password=${OPENPLOT_POSTGRES_PASSWORD:-postgres}
      Exports__RootDir: /data/exports
    volumes:
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/exports:/data/exports
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/logs/export-worker:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openplot-network

  openplot-ingestor-gsf:
    image: ${OPENPLOT_INGESTOR_GSF_IMAGE:-openplot-ingestor-gsf:${OPENPLOT_VERSION:-dev}}
    environment:
      OPENPLOT_INGESTOR__DB: Host=postgres;Port=5432;Database=${OPENPLOT_POSTGRES_DB:-postgres};Username=${OPENPLOT_POSTGRES_USER:-postgres};Password=${OPENPLOT_POSTGRES_PASSWORD:-postgres}
    volumes:
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/xml:/data/xml
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/logs/ingestor-gsf:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openplot-network

volumes:
  postgres-data:

networks:
  openplot-network:
    driver: bridge