services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: openplot-postgres
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/dumps/openplot_create_timescaledb.sql:/docker-entrypoint-initdb.d/01-openplot-create-timescaledb.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT 1 FROM pg_extension WHERE extname = 'timescaledb'"
          | grep -q 1 &&
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT 1 FROM information_schema.tables WHERE table_schema = 'openplot' AND table_name = 'measurements_ht'"
          | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - openplot-network

  openplot-api:
    build:
      context: .
      dockerfile: OpenPlot.Api/Dockerfile
    container_name: openplot-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:7011
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=postgres
      XmlFolder: /data/xml
    ports:
      - "7011:7011"
    volumes:
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/xml:/data/xml
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/exports:/data/exports
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/logs/api:/app/logs
      - ./OpenPlot.Api/Auth:/app/auth:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openplot-network

  openplot-export-worker:
    build:
      context: .
      dockerfile: OpenPlot.ExportWorker/Dockerfile
    container_name: openplot-export-worker
    environment:
      ConnectionStrings__OpenPlotDb: Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=postgres
      Exports__RootDir: /data/exports
    volumes:
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/exports:/data/exports
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/logs/export-worker:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openplot-network

  openplot-ingestor-gsf:
    build:
      context: .
      dockerfile: OpenPlot.Ingestor.Gsf/Dockerfile
    container_name: openplot-ingestor-gsf
    environment:
      OPENPLOT_INGESTOR__DB: Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=postgres
    volumes:
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/xml:/data/xml
      - ${OPENPLOT_DATA_ROOT:-/srv/openplot}/logs/ingestor-gsf:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openplot-network

volumes:
  postgres-data:

networks:
  openplot-network:
    driver: bridge