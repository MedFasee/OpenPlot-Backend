services:
  postgres:
    image: postgres:17-alpine
    container_name: openplot-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/dumps:/dumps:ro
    networks:
      - openplot-network

  openplot-api:
    build:
      context: .
      dockerfile: OpenPlot.Api/Dockerfile
    container_name: openplot-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:7011
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=postgres
      XmlFolder: /data/xml
    ports:
      - "7011:7011"
    volumes:
      - ${OPENPLOT_DATA_ROOT}/xml:/data/xml
      - ${OPENPLOT_DATA_ROOT}/exports:/data/exports
      - ${OPENPLOT_DATA_ROOT}/logs/api:/app/logs
      - ./OpenPlot.Api/Auth:/app/auth:ro
    networks:
      - openplot-network

  openplot-export-worker:
    build:
      context: .
      dockerfile: OpenPlot.ExportWorker/Dockerfile
    container_name: openplot-export-worker
    environment:
      ConnectionStrings__OpenPlotDb: Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=postgres
      Exports__RootDir: /data/exports
    volumes:
      - ${OPENPLOT_DATA_ROOT}/exports:/data/exports
      - ${OPENPLOT_DATA_ROOT}/logs/export-worker:/app/logs
    networks:
      - openplot-network

  openplot-ingestor-gsf:
    build:
      context: .
      dockerfile: OpenPlot.Ingestor.Gsf/Dockerfile
    container_name: openplot-ingestor-gsf
    environment:
      OPENPLOT_INGESTOR__DB: Host=postgres;Port=5432;Database=postgres;SearchPath=openplot;Username=postgres;Password=postgres
    volumes:
      - ${OPENPLOT_DATA_ROOT}/xml:/data/xml
      - ${OPENPLOT_DATA_ROOT}/logs/ingestor-gsf:/app/logs
    networks:
      - openplot-network

volumes:
  postgres-data:

networks:
  openplot-network:
    driver: bridge