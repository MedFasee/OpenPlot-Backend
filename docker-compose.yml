services:
  openplot-api:
    image: openplot-api:${OPENPLOT_VERSION:-dev}

    build:
      context: .
      dockerfile: OpenPlot.Api/Dockerfile
      args:
        NUGET_CONFIG: ${OPENPLOT_NUGET_CONFIG:-NuGet.dev.config}
        ENABLE_ONS_CONFIGIT: ${OPENPLOT_ENABLE_ONS_CONFIGIT:-false}

    env_file:
      - ${OPENPLOT_ENV_FILE:-.env.dev}

    environment:
      ASPNETCORE_URLS: http://+:7011
      XmlFolder: /data/xml

    ports:
      - "${OPENPLOT_API_PORT:-7011}:7011"
    
    volumes:
      - type: bind
        source: ${OPENPLOT_DATA_ROOT:-./data}/xml
        target: /data/xml

      - type: bind
        source: ${OPENPLOT_DATA_ROOT:-./data}/logs/api
        target: /app/logs

      - type: bind
        source: ${OPENPLOT_DATA_ROOT:-./data}/exports
        target: /data/exports

      - type: bind
        source: ./OpenPlot.Api/Auth/users.json
        target: /app/Auth/users.json
        read_only: true
    

    restart: unless-stopped


  openplot-export-worker:
    image: openplot-export-worker:${OPENPLOT_VERSION:-dev}

    build:
      context: .
      dockerfile: OpenPlot.ExportWorker/Dockerfile

    env_file:
      - ${OPENPLOT_ENV_FILE:-.env.dev}

    environment:
      Exports__RootDir: /data/exports

    volumes:
      - type: bind
        source: ${OPENPLOT_DATA_ROOT:-./data}/exports
        target: /data/exports

    restart: unless-stopped


  openplot-ingestor-gsf:
    image: openplot-ingestor-gsf:${OPENPLOT_VERSION:-dev}

    build:
      context: .
      dockerfile: OpenPlot.Ingestor.Gsf/Dockerfile

    env_file:
      - ${OPENPLOT_ENV_FILE:-.env.dev}

    restart: unless-stopped
